# docker compose up -d --build     (set DOMAIN in .env first)
services:
  twiza:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ['8787']
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [twiza]
volumes:
  caddy_data:
  caddy_config:
